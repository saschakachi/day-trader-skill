name: scanner-offline-tests

on:
  push:
    branches: [main]
    paths:
      - 'trader-scanner/**'
      - 'tests/test_scanner.py'
      - 'tests/_load.py'
      - 'tests/fixtures/trader-scanner/**'
      - '.github/workflows/scanner-offline-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-offline:
    name: Scanner offline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scanner fixture tests
        run: python -m unittest discover -s tests -p 'test_scanner.py' -v
